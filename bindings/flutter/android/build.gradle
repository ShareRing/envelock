// The Flutter binding for envelock.
//
// Depends on the published `envelock-android` AAR, which carries the Keystore shim, the
// generated UniFFI bindings and the JNI libraries. It must be coordinates rather than
// `project(":envelock-android")`: a plugin consumed by a real app is included on its own, and
// that app's settings.gradle knows nothing about envelock's.
//
// No `buildscript` block and no explicit Kotlin plugin: Flutter's own toolchain supplies both
// ("Built-in Kotlin"). Applying them here pins versions that then conflict with whatever the
// host app uses.
apply plugin: "com.android.library"

android {
    namespace "network.sharering.envelock.flutter"
    compileSdk 35

    defaultConfig {
        // API 23 is the floor: below it `setUserAuthenticationRequired` does not exist, so the
        // spec 2.3 security floor could not be enforced at all.
        minSdk 23
        consumerProguardFiles "consumer-rules.pro"
    }

    // Java and Kotlin must name the same JVM target explicitly. Leaving either to its default
    // gets them out of step - AGP defaults Java to 11 while Flutter's Built-in Kotlin defaults
    // to 21 - and Gradle fails the build rather than quietly disagreeing.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    sourceSets { main { kotlin.srcDirs = ["src/main/kotlin"] } }
}

dependencies {
    implementation "network.sharering:envelock-android:0.1.0"
}
