// The React Native binding for envelock.
//
// Depends on `:envelock-android`, which carries the Keystore shim, the generated UniFFI
// bindings and the JNI libraries. The JSI host functions are built from ../cpp by CMake.
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "network.sharering.envelock.reactnative"
    compileSdk 35

    defaultConfig {
        minSdk 28
        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            cmake {
                // React Native publishes its C++ modules through prefab.
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17", "-frtti", "-fexceptions"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        prefab true
    }

    packagingOptions {
        // React Native's own libraries are already in the app; ours must not duplicate them.
        excludes += ["**/libjsi.so", "**/libc++_shared.so", "**/libreactnative.so"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    sourceSets { main { java.srcDirs = ["src/main/java"] } }
}

dependencies {
    // Pinned rather than resolved by React Native's Gradle plugin, so this module compiles
    // standalone in CI. Inside a real app the plugin substitutes the app's own version; keep
    // this aligned with the `react-native` peer dependency in package.json.
    compileOnly "com.facebook.react:react-android:0.76.9"
    implementation "network.sharering:envelock-android:0.2.0"
}
